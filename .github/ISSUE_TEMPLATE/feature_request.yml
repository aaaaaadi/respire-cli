name: "Feature request / 功能请求"
description: "Propose a CLI/runtime improvement / 提议命令或运行时改进"
title: "[Feature] "
body:
  -
    type: "markdown"
    attributes:
      value: "Use English or 中文. Search existing issues first. Never post passwords, API keys/tokens, databases/backups, private memories, account identifiers or unredacted logs/screenshots. / 可用中英文；先搜索现有问题。不要提交密码、密钥/token、数据库/备份、私密记忆、账户标识或未脱敏日志/截图。\n\nSecurity vulnerabilities: do not disclose details in a public Issue or PR. Check this repository's Security tab for a private reporting option; if none is offered, ask maintainers to establish a private channel without including vulnerability details. No security email or private channel is currently documented. / 安全漏洞不要公开披露；查看本仓库 Security 页是否提供私密报告入口。若没有，只请求维护者建立私密渠道，不附漏洞细节。目前未公布安全邮箱或私密渠道。"
  -
    type: "textarea"
    id: "problem"
    attributes:
      label: "Use case and current limitation / 场景与现有限制"
      description: "Explain the concrete need and current workflow/workaround; link existing issues if relevant. / 说明具体需求、当前流程/替代方法及相关 Issue。"
    validations:
      required: true
  -
    type: "textarea"
    id: "proposal"
    attributes:
      label: "Proposed behavior and example / 建议行为与示例"
      description: "Describe expected commands/output or a minimal synthetic example; explain how to tell it works. / 描述预期命令/输出、最小虚构示例与验收方式。"
    validations:
      required: true
  -
    type: "textarea"
    id: "alternatives"
    attributes:
      label: "Alternatives / 替代方案"
      description: "What existing commands/UI or other approaches have you tried? / 已尝试哪些现有命令/界面或方案？"
    validations:
      required: false
  -
    type: "textarea"
    id: "compatibility"
    attributes:
      label: "Compatibility and impact / 兼容与影响"
      description: "If known, note JSON/MCP/API or CLI flags, stored data/index/config migration, runtime behavior, platform/performance/privacy implications. Unknown is OK. / 如已知，说明协议、参数、数据/索引/配置迁移、平台/性能/隐私影响；可写 unknown。"
    validations:
      required: false
