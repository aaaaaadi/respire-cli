name: Published performance comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/performance-model
          key: performance-m3-quantized-0826f8c1-${{ runner.os }}
      - name: Install benchmark dependencies
        run: python -m pip install cryptography==46.0.3 psutil==7.1.0
      - name: Compare immutable published binaries on the same runner
        env:
          GH_TOKEN: ${{ github.token }}
          PERF_TARGET: ${{ matrix.target }}
          PERF_ROOT: ${{ runner.temp }}/comparison
          PERF_MODEL: ${{ runner.temp }}/performance-model
        run: python scripts/compare-published-performance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-${{ matrix.target }}
          path: ${{ runner.temp }}/comparison/report.json
          if-no-files-found: error
